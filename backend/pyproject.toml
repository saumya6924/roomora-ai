[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI uses Depends() in argument defaults

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # generated code

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Dialect sqlite.*does \\*not\\* support Decimal",
]
